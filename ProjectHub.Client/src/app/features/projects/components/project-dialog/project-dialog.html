<h2 mat-dialog-title>Nuevo Proyecto</h2>

<mat-dialog-content>
  @if (errorMessage()) {
    <div class="dialog-error">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="form" class="project-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre del Proyecto</mat-label>
      <input matInput formControlName="name" placeholder="Ej. Migración a Microservicios" />
      @if (form.get('name')?.hasError('required')) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Objetivos y alcance del proyecto..."></textarea>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Fecha de Inicio</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate" />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Fecha Estimada de Fin</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="targetEndDate" />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="isSubmitting()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || isSubmitting()">
    @if (isSubmitting()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Guardar Proyecto
    }
  </button>
</mat-dialog-actions>
