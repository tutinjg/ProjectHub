<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="toggleSidebar()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title">ProjectHub</span>

  <span class="spacer"></span>

  @if (authService.currentUser(); as user) {
    <div class="user-info">
      <span class="user-name">{{ user.fullName }} ({{ user.roleName }})</span>
      <button mat-icon-button (click)="logout()" title="Cerrar Sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  } @else {
    <a mat-button routerLink="/auth/login">Iniciar Sesión</a>
  }
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav [opened]="isSidebarOpen()" mode="side" class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/companies" routerLinkActive="active-link">
        <mat-icon matListItemIcon>business</mat-icon>
        <span matListItemTitle>Empresas</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
